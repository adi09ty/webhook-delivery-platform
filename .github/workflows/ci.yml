name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A real PostgreSQL, so the suite also runs where FOR UPDATE SKIP LOCKED and real locking exist.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webhooks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Tests on SQLite, with coverage
        run: pytest --cov=app --cov-report=term-missing

      - name: Tests on PostgreSQL
        env:
          WHP_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/webhooks_test
        run: pytest
